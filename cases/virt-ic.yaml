id: virt-ic
name: VIRT-IC
repo: gabrielchv/virt-ic
tagline: >-
  One packet, five vantage points. Correlating the same datagram across host,
  bridge and container namespaces to explain how containers actually talk.
tagline_pt: >-
  Um pacote, cinco pontos de vista. Correlacionando o mesmo datagrama entre
  host, bridge e namespaces de containers para explicar como containers
  realmente conversam.
role: >-
  Undergraduate research project (Iniciação Científica): capture harness, the
  correlation key, phase segmentation and the analysis output.
period: "2026-08"
pillars:
  - platform
  - data
  - tooling
stack:
  - Python
  - Docker Compose
  - tcpdump
  - tshark
  - nsenter
  - Linux network namespaces
problem: >-
  A packet changes shape as it moves. It leaves a client on loopback, is rewritten
  by the bridge, and arrives inside another container's namespace looking like a
  different conversation. Conventional tooling shows one vantage point at a time,
  so the explanation of "what actually happened" is assembled in the reader's head
  — which is exactly where it is least reliable.
approach:
  - title: Capture everywhere at once
    body: >-
      The harness captures simultaneously on the host loopback, the host bridge and
      inside container namespaces, entering them with nsenter so no container needs
      a capture agent or a modified image.
  - title: Correlate on what survives translation
    body: >-
      Address and port cannot identify a packet across a NAT, because they are the
      things that change. The correlation key is built from the TCP sequence
      number, the IP identification field and a payload hash, which do survive the
      translation intact.
  - title: Tell the story in phases
    body: >-
      Correlated observations become logical packets, and logical packets become
      episodes with an explanation, so the output reads as a sequence of events
      rather than a wall of captures.
claims:
  - id: multi-point-capture
    text: >-
      Capture runs at five observation points simultaneously, including inside
      container network namespaces entered with nsenter rather than by instrumenting
      containers.
    cite:
      - poc/capture.py
      - run.sh
  - id: no-container-changes
    text: >-
      No container image is modified for capture; the harness runs on the host and
      enters namespaces from outside.
    cite:
      - poc/capture.py
      - compose.yml
  - id: correlation-key
    text: >-
      Packet identity is built from TCP sequence number, IP identification field and
      payload hash, because address and port change across the runtime's translation.
    cite:
      - poc/analyze.py
  - id: phases
    text: >-
      Analysis runs as three explicit stages: dissect captures into observations,
      correlate observations into logical packets, then segment those into episodes
      with explanations.
    cite:
      - poc/analyze.py
  - id: deliberate-topology
    text: >-
      The web service opens a fresh database connection per request on purpose, so
      each trace contains a complete conversation to explain.
    cite:
      - web/app.py
      - db/init.sql
  - id: vocabulary
    text: >-
      The project defines its own vocabulary — observation point, sighting, logical
      packet, episode — in a context document, so the analysis output and the code
      use the same terms.
    cite:
      - CONTEXT.md
  - id: reproducible-scenario
    text: >-
      The scenario is a two-container Compose stack started and traced by one
      script.
    cite:
      - compose.yml
      - run.sh
decisions:
  - chose: >-
      Correlating on TCP sequence, IP identification and payload hash.
    rejected: >-
      Correlating on source and destination address and port.
    why: >-
      Address and port are precisely what the container runtime rewrites, so they
      identify a packet only within one namespace. The fields chosen are the ones
      that cross the translation unchanged.
  - chose: >-
      Capturing from the host with nsenter.
    rejected: >-
      Running a capture agent inside each container.
    why: >-
      An agent inside the container changes the thing being observed, and the
      project's premise is that the image is untouched. Host-side capture keeps
      the workload exactly as it would run in production.
verification:
  - what: >-
      The trace is reproduced end to end by running the scenario script, which
      starts the stack, issues requests, captures, analyses and reports.
    cite:
      - run.sh
      - poc/capture.py
      - poc/analyze.py
limits:
  - There are no automated tests. Correctness was established by running the POC and reading the resulting traces, which is weaker than a test suite and is the main gap in this project.
  - Capture requires sudo because entering network namespaces does, so this is not something you can run unprivileged in CI.
  - The correlation key assumes TCP; UDP or encrypted payloads would break the payload-hash component and the approach would need revisiting.
  - Only a single-host Docker Compose topology is covered. Overlay networks and multi-node traffic are out of scope.
